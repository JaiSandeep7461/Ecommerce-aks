# Source: ztd-capstone/templates/networkpolicy.yaml
# Zero-trust default: deny all inbound traffic to every pod in the namespace
# unless explicitly allowed by one of the per-service policies below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ztd-capstone-default-deny-ingress
  namespace: default
  labels:
    helm.sh/chart: ztd-capstone-0.1.0
    app.kubernetes.io/name: ztd-capstone
    app.kubernetes.io/instance: ztd-capstone
    app.kubernetes.io/managed-by: Helm
    project: ztd-capstone
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
# Source: ztd-capstone/templates/networkpolicy.yaml
# Allow ingress to api-gateway on 8080 from its declared peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ztd-capstone-api-gateway-allow-ingress
  namespace: default
  labels:
    helm.sh/chart: ztd-capstone-0.1.0
    app.kubernetes.io/name: ztd-capstone
    app.kubernetes.io/instance: ztd-capstone
    app.kubernetes.io/managed-by: Helm
    project: ztd-capstone
    app.kubernetes.io/component: api-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ztd-capstone
      app.kubernetes.io/instance: ztd-capstone
      app.kubernetes.io/component: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ztd-capstone
              app.kubernetes.io/instance: ztd-capstone
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8080
    - from:
        # Prometheus (kube-prometheus-stack) scrapes /metrics on the same
        # port as app traffic — allow ingress from the observability
        # namespace so the ServiceMonitor scrape isn't blocked by the
        # default-deny policy.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
