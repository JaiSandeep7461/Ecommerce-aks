apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ztd-capstone-postgres
  namespace: default
  labels:
    helm.sh/chart: ztd-capstone-0.1.0
    app.kubernetes.io/name: ztd-capstone
    app.kubernetes.io/instance: ztd-capstone
    app.kubernetes.io/managed-by: Helm
    project: ztd-capstone
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ztd-capstone
      app.kubernetes.io/instance: ztd-capstone
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        helm.sh/chart: ztd-capstone-0.1.0
        app.kubernetes.io/name: ztd-capstone
        app.kubernetes.io/instance: ztd-capstone
        app.kubernetes.io/managed-by: Helm
        project: ztd-capstone
        app.kubernetes.io/component: postgres
    spec:
      nodeSelector:
        workload: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "postgres:16"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "ztd"
            - name: POSTGRES_USER
              value: "ztd"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ztd-capstone-postgres
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ztd
                - -d
                - ztd
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ztd
                - -d
                - ztd
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          helm.sh/chart: ztd-capstone-0.1.0
          app.kubernetes.io/name: ztd-capstone
          app.kubernetes.io/instance: ztd-capstone
          app.kubernetes.io/managed-by: Helm
          project: ztd-capstone
          app.kubernetes.io/component: postgres
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: managed-csi
        resources:
          requests:
            storage: 5Gi
