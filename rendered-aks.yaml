apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztd-capstone-orders
  namespace: default
  labels:
    helm.sh/chart: ztd-capstone-0.1.0
    app.kubernetes.io/name: ztd-capstone
    app.kubernetes.io/instance: ztd-capstone
    app.kubernetes.io/managed-by: Helm
    project: ztd-capstone
    app.kubernetes.io/component: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ztd-capstone
      app.kubernetes.io/instance: ztd-capstone
      app.kubernetes.io/component: orders
  template:
    metadata:
      labels:
        helm.sh/chart: ztd-capstone-0.1.0
        app.kubernetes.io/name: ztd-capstone
        app.kubernetes.io/instance: ztd-capstone
        app.kubernetes.io/managed-by: Helm
        project: ztd-capstone
        app.kubernetes.io/component: orders
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ztd-capstone-orders
      nodeSelector:
        workload: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # Block startup until Postgres is reachable. The app opens its DB
      # connection pool once at boot; without this gate a pod that starts
      # before Postgres (or before its DNS record exists) skips schema init
      # and never recovers, since liveness (/healthz) stays 200. This makes
      # the ordering deterministic across (re)deploys and reschedules.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres:5432..."; sleep 2;
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: orders
          image: ztdacrvqurc.azurecr.io/ztd-capstone/orders:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CATALOG_URL
              value: "http://catalog"
            - name: OTEL_SERVICE_NAME
              value: "orders"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://opentelemetry-collector.observability:4318"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ztd-capstone-postgres
                  key: database-url
          resources:
            limits:
              cpu: 400m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
