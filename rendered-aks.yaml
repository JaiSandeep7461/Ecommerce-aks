# Source: ztd-capstone/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztd-capstone-api-gateway
  namespace: default
  labels:
    helm.sh/chart: ztd-capstone-0.1.0
    app.kubernetes.io/name: ztd-capstone
    app.kubernetes.io/instance: ztd-capstone
    app.kubernetes.io/managed-by: Helm
    project: ztd-capstone
    app.kubernetes.io/component: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ztd-capstone
      app.kubernetes.io/instance: ztd-capstone
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        helm.sh/chart: ztd-capstone-0.1.0
        app.kubernetes.io/name: ztd-capstone
        app.kubernetes.io/instance: ztd-capstone
        app.kubernetes.io/managed-by: Helm
        project: ztd-capstone
        app.kubernetes.io/component: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ztd-capstone-api-gateway
      nodeSelector:
        workload: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ztdacrvqurc.azurecr.io/ztd-capstone/api-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CATALOG_URL
              value: "http://catalog"
            - name: ORDERS_URL
              value: "http://orders"
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://opentelemetry-collector.observability:4318"
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
