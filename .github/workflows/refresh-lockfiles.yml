name: refresh-dependency-lockfiles
on:
  push:
    branches: [fix/repo-ci-security]
    paths:
      - 'services/api-gateway/package.json'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/repo-ci-security
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Regenerate npm lockfiles with current compatible versions
        run: |
          for service in api-gateway frontend; do
            cd "services/$service"
            npm install --package-lock-only
            npm update --package-lock-only
            cd "$GITHUB_WORKSPACE"
          done
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/catalog/go.sum
      - name: Regenerate Go module checksums
        working-directory: services/catalog
        run: go mod tidy
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api-gateway/package-lock.json services/frontend/package-lock.json services/catalog/go.mod services/catalog/go.sum
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date"
            exit 0
          fi
          git commit -m "chore(deps): regenerate lockfiles after security updates"
          git push origin HEAD:fix/repo-ci-security
