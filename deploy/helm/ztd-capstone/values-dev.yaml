# Dev overrides — single replica, low-traffic CPU requests, HPA/PDB off.
# Recreate deletes the old pod before creating its replacement. This avoids
# rolling-update surge pods that cannot fit on the single small dev node.
deploymentStrategy: Recreate
image:
  tag: sha-4f8904e

ingress:
  host: dev.ztd-capstone.example.com

# The observability stack is not installed in this low-cost dev setup.
# Keep ServiceMonitor resources disabled until Prometheus Operator CRDs exist.
metrics:
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: true

# This cluster intentionally uses one small AKS node for the dev lab.
# Keep the container CPU limits from values.yaml, but lower CPU requests so
# all five workloads can be scheduled beside AKS system and Argo CD pods.
services:
  catalog:
    replicas: 1
    resources:
      requests:
        cpu: 10m
    hpa:
      enabled: false
    pdb:
      enabled: false

  orders:
    replicas: 1
    resources:
      requests:
        cpu: 15m
    hpa:
      enabled: false
    pdb:
      enabled: false

  api-gateway:
    replicas: 1
    resources:
      requests:
        cpu: 10m
    hpa:
      enabled: false
    pdb:
      enabled: false

  frontend:
    replicas: 1
    resources:
      requests:
        cpu: 10m
    hpa:
      enabled: false
    pdb:
      enabled: false

postgres:
  storage: 2Gi
  resources:
    requests:
      cpu: 25m
