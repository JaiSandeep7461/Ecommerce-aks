# Dev overrides — single replica, minimal resources, HPA/PDB off.
image:
  tag: sha-960c1e2

ingress:
  host: dev.ztd-capstone.example.com

# The observability stack is not installed in this low-cost dev setup.
# Keep ServiceMonitor resources disabled until Prometheus Operator CRDs exist.
metrics:
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: true

services:
  catalog:
    replicas: 1
    hpa:
      enabled: false
    pdb:
      enabled: false

  orders:
    replicas: 1
    hpa:
      enabled: false
    pdb:
      enabled: false

  api-gateway:
    replicas: 1
    hpa:
      enabled: false
    pdb:
      enabled: false

  frontend:
    replicas: 1
    hpa:
      enabled: false
    pdb:
      enabled: false

postgres:
  storage: 2Gi
